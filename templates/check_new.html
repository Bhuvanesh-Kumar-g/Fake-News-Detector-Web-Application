<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify News</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="tool-page">

    <!-- Simple Nav -->
    <nav style="padding: 20px;">
        <a href="/" class="btn" style="padding: 8px 20px; font-size: 1rem; background: rgba(0,0,0,0.5);">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span> Back Home
        </a>
    </nav>

    <!-- Main Tool Container -->
    <div class="glass-container" style="margin-top: 10px;">
        <h1>Verify News</h1>
        <p>Paste a headline or article text below to check if it is Real or Fake.</p>
        
        <form id="newsForm">
            <div class="input-group">
                <textarea id="newsInput" placeholder="Paste news headline here..." required></textarea>
            </div>
            <button type="submit" class="btn" id="searchButton">
                <span class="material-symbols-outlined">search</span> Verify Authenticity
            </button>
        </form>

        <!-- Loader -->
        <div class="loader" id="loader"></div>
        <div id="errorMessage" style="color: #ff6b6b; display: none; margin-top: 15px; font-weight: bold;"></div>
        
        <!-- Results Section -->
        <div id="resultContainer" class="verdict-box" style="display: none;">
            
            <h2 id="classificationContainer"></h2>
            <div id="accuracyContainer" style="font-size: 1.2rem; opacity: 0.9;"></div>

            <div id="explanationContainer" class="explanation-list" style="display: none;"></div>

            <div id="topArticlesContainer" style="margin-top: 25px; display: none;">
                <h3>Related Sources:</h3>
                <!-- JS Inject -->
            </div>

            <div id="buttonContainer" style="margin-top: 20px; display: none;">
                <button id="showArticlesButton" class="btn" style="background: transparent; border: 1px solid white;">Show All Sources</button>
            </div>

            <div id="articlesContainer" style="margin-top: 20px; display: none;"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Fake News Identifier. Powered by AI.</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        document.getElementById('newsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newsInput = document.getElementById('newsInput').value;
            const elements = {
                result: document.getElementById('resultContainer'),
                accuracy: document.getElementById('accuracyContainer'),
                classification: document.getElementById('classificationContainer'),
                loader: document.getElementById('loader'),
                error: document.getElementById('errorMessage'),
                btnContainer: document.getElementById('buttonContainer'),
                topArticles: document.getElementById('topArticlesContainer'),
                allArticles: document.getElementById('articlesContainer'),
                showBtn: document.getElementById('showArticlesButton'),
                explanation: document.getElementById('explanationContainer')
            };

            elements.loader.style.display = 'block';
            elements.result.style.display = 'none';
            elements.topArticles.style.display = 'none';
            elements.btnContainer.style.display = 'none';
            elements.allArticles.style.display = 'none';
            elements.error.style.display = 'none';
            elements.explanation.style.display = 'none';

            fetch('/check_news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ news_input: newsInput })
            })
            .then(response => response.json())
            .then(data => {
                elements.loader.style.display = 'none';

                if (data.error) {
                    elements.error.style.display = 'block';
                    elements.error.textContent = data.error;
                    return;
                }

                elements.classification.textContent = data.majority_vote;
                if(data.majority_vote === 'Authentic') {
                    elements.classification.style.color = '#2ecc71'; 
                } else if (data.majority_vote === 'Fake') {
                    elements.classification.style.color = '#e74c3c'; 
                } else {
                    elements.classification.style.color = '#f1c40f'; 
                }
                
                elements.accuracy.textContent = `Confidence: ${data.accuracy}%`;
                elements.result.style.display = 'block';

                if (data.explanation) {
                    let clean = data.explanation.replace(/Status:.*\n?/, '');
                    if (clean.includes('*')) {
                        const points = clean.split('*').filter(p => p.trim() !== '');
                        let html = '<h3>AI Analysis:</h3><ul>';
                        points.forEach(p => html += `<li>${p.trim()}</li>`);
                        html += '</ul>';
                        elements.explanation.innerHTML = html;
                    } else {
                        elements.explanation.innerHTML = `<h3>AI Analysis:</h3><p>${clean}</p>`;
                    }
                    elements.explanation.style.display = 'block';
                }

                if (data.top_articles && data.top_articles.length > 0) {
                    elements.topArticles.innerHTML = '<h3>Related Sources:</h3>';
                    data.top_articles.forEach(article => {
                        const div = document.createElement('div');
                        div.className = 'article-item';
                        div.innerHTML = `<a href="${article.url}" target="_blank">${article.title}</a>`;
                        elements.topArticles.appendChild(div);
                    });
                    elements.topArticles.style.display = 'block';
                    elements.btnContainer.style.display = 'block';
                    
                    elements.showBtn.onclick = () => {
                        if (elements.allArticles.style.display === 'none') {
                            elements.allArticles.innerHTML = '<h3>All Sources:</h3>';
                            data.all_articles.forEach(article => {
                                const div = document.createElement('div');
                                div.className = 'article-item';
                                div.innerHTML = `<a href="${article.url}" target="_blank">${article.title}</a>`;
                                elements.allArticles.appendChild(div);
                            });
                            elements.allArticles.style.display = 'block';
                            elements.showBtn.textContent = 'Hide Sources';
                        } else {
                            elements.allArticles.style.display = 'none';
                            elements.showBtn.textContent = 'Show All Sources';
                        }
                    };
                }
            })
            .catch(err => {
                elements.loader.style.display = 'none';
                elements.error.style.display = 'block';
                elements.error.textContent = "Server error. Please check connection.";
                console.error(err);
            });
        });
    </script>
</body>
</html>
